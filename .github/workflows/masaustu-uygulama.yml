name: Masaüstü uygulaması (Windows + macOS)

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "yayin-paneli-masaustu/**"
      - ".github/workflows/masaustu-uygulama.yml"

jobs:
  masaustu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - isletim: windows-latest
            ad: windows
            komut: npx electron-builder --win portable nsis
            cikti: yayin-paneli-masaustu/dist/*.exe
          - isletim: macos-latest
            ad: macos
            komut: npx electron-builder --mac dmg zip
            cikti: |
              yayin-paneli-masaustu/dist/*.dmg
              yayin-paneli-masaustu/dist/*.zip
    runs-on: ${{ matrix.isletim }}
    defaults:
      run:
        working-directory: yayin-paneli-masaustu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: ${{ matrix.komut }}
        env:
          GH_TOKEN: ""
          # Uygulama kod imzası olmadan paketlenir; imzalama anahtarı yok.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: YayinPaneli-${{ matrix.ad }}
          path: ${{ matrix.cikti }}
          if-no-files-found: error
